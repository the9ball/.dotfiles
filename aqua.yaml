---
# aqua - Declarative CLI Version Manager
# https://aquaproj.github.io/
#
# バージョンは自動更新されない。このリポジトリでRenovateなどのbotは動いておらず、
# GitHub上のリモートも受け皿にすぎないため、折を見て手動で更新する。
# `aqua update` は更新が有効なパッケージを最新へ上げてしまうので、kubectl(クラスタとの
# バージョンスキュー)とpinact(メジャー跨ぎ)は個別に判断すること。
# checksum:
#   enabled: true
#   require_checksum: true
#   supported_envs:
#   - all
registries:
- type: standard
  ref: v4.556.0
packages:
- name: nodejs/node@v26.8.1
- name: ahmetb/kubectx@v0.11.0
- name: ahmetb/kubectx/kubens@v0.11.0
- name: kubernetes/kubectl@v1.36.2
  update:
    enabled: false
- name: aws/aws-cli@2.36.33
- name: 99designs/aws-vault@v7.2.0
- name: cli/cli@v2.99.0
- name: jqlang/jq@jq-1.8.2
- name: gitleaks/gitleaks@v8.30.1
- name: j178/prek@v0.5.0
- name: suzuki-shunsuke/pinact@v3.1.2
  update:
    enabled: false
- name: ynqa/jnv@v0.7.1
- name: itaysk/kubectl-neat@v2.0.4
- name: stern/stern@v1.34.0
- name: astral-sh/uv@0.12.7
