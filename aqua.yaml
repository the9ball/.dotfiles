---
# aqua - Declarative CLI Version Manager
# https://aquaproj.github.io/
#
# Package management policy:
# Prefer aqua for CLI tools and standalone executables.
# Exception: Windows OpenSSH Server is managed as an OS optional feature
# because its installation and lifecycle are integrated with Windows services
# and security updates. Do not add sshd to aqua.
#
# バージョンは自動更新されない。このリポジトリでRenovateなどのbotは動いておらず、
# GitHub上のリモートも受け皿にすぎないため、折を見て手動で更新する。
# openai/codexもAquaで管理する。更新時は`aqua update codex`で宣言を更新し、
# 差分を確認してコミットした後に`aqua install`を実行する。
# Aqua管理のcodexには`codex update`を使用しない。
# kubectl は接続先クラスタのバージョンに合わせてプロダクト側で管理し、ここでは導入しない。
# checksum:
#   enabled: true
#   require_checksum: true
#   supported_envs:
#   - all
registries:
- type: local
  name: local
  path: aqua-registry.yaml
- type: standard
  ref: v4.575.0
packages:
- name: cloudflare/cloudflared@2026.10.3
# Native tmux builds for Linux and macOS (not available on Windows).
- name: tmux/tmux-builds@v3.7c
# Windows-native tmux-compatible session manager.
- name: psmux/psmux@v3.4.0
  registry: local
- name: twpayne/chezmoi@v2.73.3
- name: nodejs/node@v26.12.1
- name: openai/codex@rust-v0.163.0
# kubectxを更新したら、補完スクリプトの取得元(chezmoi/.chezmoiexternal.toml)のタグとsha256も同じバージョンに揃える。
- name: ahmetb/kubectx@v0.11.0
# kubensも同様に、chezmoi/.chezmoiexternal.tomlの補完スクリプトのタグとsha256を揃える。
- name: ahmetb/kubectx/kubens@v0.11.0
- name: aws/aws-cli@2.37.0
- name: 99designs/aws-vault@v7.2.0
- name: cli/cli@v2.103.0
- name: jqlang/jq@jq-1.8.2
- name: gitleaks/gitleaks@v8.30.1
- name: j178/prek@v0.5.7
- name: suzuki-shunsuke/pinact@v5.0.1
- name: ynqa/jnv@v0.7.1
- name: itaysk/kubectl-neat@v2.0.4
- name: stern/stern@v1.35.0
- name: astral-sh/uv@0.13.5
- name: anthropics/claude-code@v2.1.309
- name: BurntSushi/ripgrep@15.2.0
- name: bootandy/dust@v1.2.6
- name: nektos/act@v0.2.89
- name: rhysd/actionlint@v1.7.12
- name: open-policy-agent/conftest@v0.71.1
- name: editorconfig/editorconfig-core-go@v2.6.5
  tags:
  - code-formatting
- name: editorconfig-checker/editorconfig-checker@v4.0.2
  tags:
  - code-formatting
- name: github/git-sizer@v1.5.0
- name: helm/helm@v4.3.1
