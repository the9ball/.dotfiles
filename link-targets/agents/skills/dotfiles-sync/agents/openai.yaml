interface:
  display_name: "dotfiles同期"
  short_description: "masterを最新にし、依頼時はRenovateでaquaを更新してchezmoi applyまで行う"
  default_prompt: "Use $dotfiles-sync to fast-forward master, run Renovate for aqua packages, wait for any resulting PR to merge, and apply chezmoi changes I approve."

policy:
  allow_implicit_invocation: true
