# Stable Codex settings shared by the personal profile.
# Runtime state such as projects, hooks.state, and tui.model_availability_nux
# is intentionally kept in the destination config and is not managed here.
# Host-specific absolute paths belong in codex-personal-defaults.toml.local.

approval_policy = "on-request"
approvals_reviewer = "auto_review"
service_tier = "default"
model = "gpt-5.6-luna"
model_reasoning_effort = "max"
personality = "pragmatic"
model_verbosity = "low"
model_reasoning_summary = "concise"
default_permissions = "personal-standard"
suppress_unstable_features_warning = true

[notice]
fast_default_opt_out = true

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 10
max_depth = 5

[features]
js_repl = false
multi_agent = true
default_mode_request_user_input = true
network_proxy = true

[features.multi_agent_v2]
enabled = true
# Re-check long-running child work every 20 minutes, while retaining a
# one-hour upper bound for autonomous runs.
default_wait_timeout_ms = 1_200_000
max_wait_timeout_ms = 3_600_000

[features.context_management]
experimental_mode = true

[permissions.personal-standard]
extends = ":workspace"

[permissions.personal-standard.network]
enabled = true

[permissions.personal-standard.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"

[permissions.personal-emergency]
extends = "personal-standard"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = false
reviewDelivery = "detached"
composerEnterBehavior = "cmdAlways"
followUpQueueMode = "steer"
show-context-window-usage = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
worktree-upstream-refresh-mode = "best-effort"

[desktop.appearanceLightChromeTheme]
accent = "#3a83f7"
accentSource = "chatgpt"
contrast = 45
ink = "#1a1c1f"
opaqueWindows = true
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#ba2623"
skill = "#924ff7"

[desktop.appearanceDarkChromeTheme]
accent = "#3a83f7"
accentSource = "chatgpt"
contrast = 60
ink = "#ffffff"
opaqueWindows = true
surface = "#181818"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#40c977"
diffRemoved = "#fa423e"
skill = "#ad7bf9"

[windows]
sandbox = "unelevated"
