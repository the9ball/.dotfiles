# Stable Codex settings shared by the personal profile.
# Runtime state such as projects, hooks.state, and tui.model_availability_nux
# is intentionally kept in the destination config and is not managed here.

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
service_tier = "default"
model = "gpt-5.6-luna"
model_reasoning_effort = "max"
personality = "pragmatic"
model_verbosity = "low"
model_reasoning_summary = "concise"
default_permissions = "default-permissions"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."dotnet@dotnet-agent-skills"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 10
max_depth = 5

[features]
js_repl = false
multi_agent = true
default_mode_request_user_input = true
network_proxy = true

[features.multi_agent_v2]
enabled = true

[permissions.default-permissions]
extends = ":workspace"

[permissions.default-permissions.filesystem]
'C:\Users\syasui\AppData\Roaming\GitHub CLI' = "read"
'D:\repository' = "write"
'C:\Users\syasui\work\gitmeta' = "write"

[permissions.default-permissions.network]
enabled = true

[permissions.default-permissions.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"

[mcp_servers.datadog]
url = "https://mcp.datadoghq.com/v1/mcp"
bearer_token_env_var = "DD_ACCESS_TOKEN"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = false
reviewDelivery = "detached"
composerEnterBehavior = "cmdAlways"
followUpQueueMode = "steer"
show-context-window-usage = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
worktree-upstream-refresh-mode = "best-effort"

[desktop.appearanceLightChromeTheme]
accent = "#3a83f7"
accentSource = "chatgpt"
contrast = 45
ink = "#1a1c1f"
opaqueWindows = true
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#ba2623"
skill = "#924ff7"

[desktop.appearanceDarkChromeTheme]
accent = "#3a83f7"
accentSource = "chatgpt"
contrast = 60
ink = "#ffffff"
opaqueWindows = true
surface = "#181818"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#40c977"
diffRemoved = "#fa423e"
skill = "#ad7bf9"

[windows]
sandbox = "unelevated"
