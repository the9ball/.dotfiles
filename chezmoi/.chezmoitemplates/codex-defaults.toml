# Regular Codex permission defaults, layered over codex-common-defaults.toml.
# Host-specific overrides belong in codex-defaults.toml.local.

default_permissions = "default-permissions"

[permissions.default-permissions]
extends = ":workspace"

[permissions.default-permissions.network]
enabled = true

[permissions.default-permissions.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"
