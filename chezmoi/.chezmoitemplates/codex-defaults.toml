# Stable Codex settings for the default work account.
#
# Keep runtime-owned state out of this file. The modify_ template preserves
# projects, hooks.state, model availability, and other keys written by Codex.
# Host-specific paths or integrations belong in codex-defaults.toml.local.

approval_policy = "on-request"
approvals_reviewer = "auto_review"
service_tier = "default"
model = "gpt-5.6-luna"
model_reasoning_effort = "max"
personality = "pragmatic"
model_verbosity = "low"
model_reasoning_summary = "concise"
default_permissions = "default-permissions"
suppress_unstable_features_warning = true

[notice]
fast_default_opt_out = true

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 10
max_depth = 5

[features]
js_repl = false
multi_agent = true
default_mode_request_user_input = true
network_proxy = true

[features.multi_agent_v2]
enabled = true
# Re-check long-running child work every 20 minutes, while retaining a
# one-hour upper bound for autonomous runs.
default_wait_timeout_ms = 1_200_000
max_wait_timeout_ms = 3_600_000

[features.context_management]
experimental_mode = true

[permissions.default-permissions]
extends = ":workspace"

# Permission profiles are beta and may change with Codex releases.
# :root denies broad filesystem access; :minimal keeps the platform/runtime
# paths required by common tools readable. Revalidate this policy on upgrades.
# Configuration shape checked with Codex CLI 0.153.4; runtime canary remains
# part of Issue #16 completion.
# Reference: https://learn.chatgpt.com/docs/permissions
[permissions.default-permissions.filesystem]
":root" = "deny"
":minimal" = "read"

[permissions.default-permissions.network]
enabled = true

[permissions.default-permissions.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"
