name: Renovate aqua packages

on:
  schedule:
    - cron: '20 20 * * *' # 05:20 JST (next calendar day)
  workflow_dispatch:

permissions: {}

concurrency:
  group: aqua-package-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # The action mounts /tmp by default. Use a fresh path for each attempt.
      RENOVATE_REPORT_PATH: /tmp/renovate-report-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - name: Create Renovate App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Run Renovate
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Update the Renovate version and digest manually.
          renovate-version: 44.263.5@sha256:9806d1b444f2b0b57d7c3b882d453b99c7494db07689c2e1abed8e6ae502b271
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          # Renovate discovers .github/renovate.json5 on the default branch.
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
          RENOVATE_REPORT_TYPE: file

      - name: Check Renovate report
        shell: bash
        env:
          REPORT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Check extraction from aqua.yaml and inspect dependency results across all managers.
          jq -ers --arg repository "$REPORT_REPOSITORY" '
            if length == 1 then .[0] else error("Expected one Renovate report") end
            | .repositories[$repository] // error("Missing report entry for " + $repository)
            | [.packageFiles[]?[]?] as $packageFiles
            | [
                (if any($packageFiles[] | select(.packageFile == "aqua.yaml") | .deps[]?; .skipReason == null) then empty
                 else "No active dependencies in aqua.yaml" end),
                ($packageFiles[].deps[]? | .depName as $name |
                  (.warnings[]? | "\($name): \(.topic): \(.message)"),
                  (select(.skipReason != null and .skipReason != "disabled" and .skipReason != "package-rules")
                   | "\($name): unexpected skipReason \(.skipReason)"),
                  (select(.skipReason == null and ($name | startswith("ahmetb/kubectx")))
                   | "\($name): expected this dependency to be skipped")),
                (.branches[]? |
                  select(.result | IN("error", "pr-limit-reached", "branch-limit-reached",
                                      "commit-per-run-limit-reached", "commit-hourly-limit-reached"))
                  | "\(.branchName): \(.result) (\([.upgrades[]?.depName] | join(", ")))")
              ]
            | if length == 0 then "Renovate report passed"
              else (join("\n") + "\n" | halt_error(1)) end
          ' "$RENOVATE_REPORT_PATH"
